name: newsverify

services:
  db:
    image: postgres:16.4-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - newsverify_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 512M
    networks: [newsverify]

  bot:
    build:
      context: .
      dockerfile: Dockerfile
    image: newsverify:0.5.1
    restart: unless-stopped
    env_file: .env
    environment:
      APP_MODE: all
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "0.0.0.0:8095:8095"
    deploy:
      resources:
        limits:
          memory: 512M
    read_only: false
    tmpfs:
      - /tmp:size=100m
    networks: [newsverify]

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    image: newsverify:0.5.1
    restart: unless-stopped
    env_file: .env
    environment:
      APP_MODE: worker
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M
    read_only: false
    tmpfs:
      - /tmp:size=100m
    networks: [newsverify]
    healthcheck:
      disable: true

volumes:
  newsverify_pgdata:

networks:
  newsverify:
    driver: bridge