[project]
name = "newsverify"
version = "0.7.1"
description = "NewsVerify: personal news fact-checking and tracking service for NAS"
requires-python = ">=3.11"
dependencies = [
  "aiogram>=3.13.0",
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "sqlalchemy[asyncio]>=2.0.30",
  "asyncpg>=0.29.0",
  "httpx>=0.27.0",
  "beautifulsoup4>=4.12.0",
  "lxml>=5.2.0",
  "trafilatura>=1.9.0",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.4.0",
  "openai>=1.40.0",
  "tenacity>=9.0.0",
  "ddgs>=6.0.0",
  "python-dotenv>=1.0.0",
  "alembic>=1.13.0",
  "structlog>=24.2.0",
  "prometheus-client>=0.20.0",
  "python-multipart>=0.0.9",
  "segno>=1.5.3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
  "pytest-asyncio>=0.23.0",
  "pytest-cov>=5.0.0",
  "ruff>=0.6.0",
  "mypy>=1.11.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"